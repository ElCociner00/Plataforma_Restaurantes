name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    branches:
      - main
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    # Sin esto, el GITHUB_TOKEN por defecto no alcanza para que la accion
    # comente el enlace de la vista previa en el PR: falla en segundos, antes
    # de llegar siquiera a Firebase. No afecta al despliegue de produccion
    # (firebase-hosting-merge.yml), que corre en push a main, no en un PR, y
    # no necesita comentar nada.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLATAFORMA_RESTAURANTES_8F561 }}'
          projectId: plataforma-restaurantes-8f561
