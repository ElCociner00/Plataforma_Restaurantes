<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AXIOMA | Visualización histórico cierre turno</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/visualizacion_cierre_turno_historico.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</head>
<body style="display:none">
  <script type="module" src="../js/router.js"></script>
<script type="module" src="../js/header.js"></script>

  <div class="main">
    <h1>Visualización histórico cierre turno</h1>
    <p class="descripcion">Administra qué campos generales y qué campos de detalle se muestran en el histórico.</p>

    <section class="panel">
      <h2>Campos generales</h2>
      <div class="bulk-actions" data-target="columnasGeneralesPanel">
        <button type="button" class="btn-bulk-activar">Activar todas</button>
        <button type="button" class="btn-bulk-desactivar">Desactivar todas</button>
      </div>
      <div id="columnasGeneralesPanel" class="panel-grid"></div>
    </section>

    <section class="panel">
      <h2>Campos de detalle</h2>
      <div class="bulk-actions" data-target="columnasDetallePanel">
        <button type="button" class="btn-bulk-activar">Activar todas</button>
        <button type="button" class="btn-bulk-desactivar">Desactivar todas</button>
      </div>
      <div id="columnasDetallePanel" class="panel-grid"></div>
    </section>

    <section class="panel">
      <h2>Items de detalle (filas)</h2>
      <p class="descripcion">Por defecto se muestran categorías <strong>real</strong> y <strong>sistema</strong>; gastos vienen ocultos.</p>
      <div class="bulk-actions" data-target="itemsDetallePanel">
        <button type="button" class="btn-bulk-activar">Activar todas</button>
        <button type="button" class="btn-bulk-desactivar">Desactivar todas</button>
      </div>
      <div id="itemsDetallePanel" class="panel-grid"></div>
    </section>

    <div id="status" class="status"></div>
  </div>

  <script type="module" src="../js/visualizacion_cierre_turno_historico.js"></script>
  <script type="module" src="../js/footer.js"></script>
  <!-- Parche de autenticación para módulos (aislado) -->
  <script type="module" src="../js/module_fix/init.js"></script>
</body>
</html>
