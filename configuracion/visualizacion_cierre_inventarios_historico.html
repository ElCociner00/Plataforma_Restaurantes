<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AXIOMA | Visualización histórico cierre inventarios</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/visualizacion_cierre_turno_historico.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</head>
<body style="display:none">
  <script type="module" src="../js/router.js"></script>
<script type="module" src="../js/header.js"></script>

  <div class="main">
    <h1>Visualización histórico cierre inventarios</h1>
    <p class="descripcion">Oculta/muestra columnas, filas de detalle y productos completos. También puedes reordenar listas (drag & drop).</p>

    <section class="panel">
      <h2>Columnas generales</h2>
      <div class="bulk-actions" data-target="columnasGeneralesPanel">
        <button type="button" class="btn-bulk-activar">Activar todas</button>
        <button type="button" class="btn-bulk-desactivar">Desactivar todas</button>
      </div>
      <div id="columnasGeneralesPanel" class="panel-grid"></div>
    </section>

    <section class="panel">
      <h2>Columnas detalle productos</h2>
      <div class="bulk-actions" data-target="columnasDetallePanel">
        <button type="button" class="btn-bulk-activar">Activar todas</button>
        <button type="button" class="btn-bulk-desactivar">Desactivar todas</button>
      </div>
      <div id="columnasDetallePanel" class="panel-grid"></div>
    </section>

    <section class="panel">
      <h2>Productos (oculta todas sus filas)</h2>
      <div class="bulk-actions" data-target="productosPanel">
        <button type="button" class="btn-bulk-activar">Activar todas</button>
        <button type="button" class="btn-bulk-desactivar">Desactivar todas</button>
      </div>
      <div id="productosPanel" class="panel-grid"></div>
    </section>

    <section class="panel">
      <h2>Filas de detalle (producto + turno)</h2>
      <div class="bulk-actions" data-target="filasDetallePanel">
        <button type="button" class="btn-bulk-activar">Activar todas</button>
        <button type="button" class="btn-bulk-desactivar">Desactivar todas</button>
      </div>
      <div id="filasDetallePanel" class="panel-grid"></div>
    </section>

    <div id="status" class="status"></div>
  </div>

  <script type="module" src="../js/visualizacion_cierre_inventarios_historico.js"></script>
  <script type="module" src="../js/footer.js"></script>
  <!-- Parche de autenticación para módulos (aislado) -->
  <script type="module" src="../js/module_fix/init.js"></script>
</body>
</html>
